<nav class="navbar navbar-expand-lg px-5">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Facultative System</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" [routerLink]="['/']">Home</a>
        </li>
        <ng-container *ngIf="user !== undefined && user.roles.includes('admin')">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Admin
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" [routerLink]="['/admin/course']">Courses</a></li>
            <li><a class="dropdown-item" [routerLink]="['/admin/teacher']">Teachers</a></li>
            <li><a class="dropdown-item" [routerLink]="['/admin/student']">Students</a></li>
<!--            <li><a class="dropdown-item" href="#">Something else here</a></li>-->
          </ul>
        </li>
        </ng-container>

        <ng-container *ngIf="user !== undefined && user.roles.includes('student')">
          <a class="nav-link active" aria-current="page" [routerLink]="['/student', user.id, 'grades']">Diary</a>
        </ng-container>

        <ng-container *ngIf="user !== undefined && user.roles.includes('teacher')">
          <a class="nav-link active" aria-current="page" [routerLink]="['/teacher', user.id, 'courses']">My Courses</a>
        </ng-container>

      </ul>
    </div>

    <div class="d-flex">

      <ng-container *ngIf = "user === undefined; else showLogout">
        <!-- Show login-button -->
          <a [routerLink]="['/login']" class="btn btn-primary" >Login</a>
          <a [routerLink]="['/register']" class="btn primary">Register</a>
      </ng-container>
      <ng-template #showLogout>
        <div class="d-flex align-items-center">
          <span>{{user?.email}}</span>
          <button class="btn btn-primary ms-3" (click)="onLogout()">Logout</button>
        </div>

      </ng-template>
    </div>

  </div>
</nav>
