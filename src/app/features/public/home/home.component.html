<div class="container">
  <div class="my-5">
    <div class="row align-items-strech">
      <ng-container *ngIf = "courses$ | async as courses">
        <div class="con-12 col-md-4 mb-3" *ngFor="let course of courses">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <h5>
                {{course.name}}
              </h5>
              <p>Teacher: {{course.teacherName}}</p>
              <span class="d-flex align-items-end " style="flex: 1">
                <a [routerLink]="['/course', course.id]" class="btn btn-primary">
                  Read more
                </a>
              </span>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
