<div class="container">
  <div class="mt-5">
    <div class="col-12 col-md-6  col-lg-4 mx-auto">

      <h1>Registration</h1>

      <form #form = "ngForm" (ngSubmit)="submitForm()">

        <div class="mt-3">
          <label for="email" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name = "name" [(ngModel)]="model.userName">
        </div>

        <div class="mt-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" class="form-control" id="email" name = "email" [(ngModel)]="model.email">
        </div>

        <div class="mt-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name = "password" [(ngModel)]="model.password">
        </div>

        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Register</button>
        </div>

      </form>

    </div>
  </div>
</div>
