<div class="container">
  <h1>Diary</h1>

  <ng-container *ngIf="grades">
    <div class="table-wrapper">
    <table class="table-dress">
      <thead>
      <tr>
        <th>Course</th>
        <th>Grade</th>
        <th>Feedback</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let grade of grades">
        <td>{{grade.course}}</td>
        <ng-container *ngIf="+grade.grade !== 0; else notGrade">
          <td>{{grade.grade}}</td>
        </ng-container>
        <ng-template #notGrade>
          <td>-</td>
        </ng-template>
        <ng-container *ngIf="grade.feedback.length!==0; else notFeedback">
          <td>{{grade.feedback}}</td>
        </ng-container>
        <ng-template #notFeedback>
          <td class="fst-italic fw-lighter">Any feedback yet</td>
        </ng-template>
      </tr>
      </tbody>
    </table>
    </div>
  </ng-container>
</div>
