<div class="container">
  <h1>Diary</h1>

  <ng-container *ngIf="grades">
    <table class="mt-3 table table-bordered">
      <thead>
      <tr>
        <th>Course</th>
        <th>Grade</th>
        <th>Feedback</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let grade of grades">
        <td>{{grade.course}}</td>
        <td>{{grade.grade}}</td>
        <td>{{grade.feedback}}</td>
      </tr>
      </tbody>
    </table>
  </ng-container>
</div>
