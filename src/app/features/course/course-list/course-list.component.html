<div class="container">
  <h1 class="mt-3">List of courses</h1>
  <div class="d-flex justify-content-end mt-3">
    <a [routerLink]="['/admin/course/add']"  class="btn button">Add course</a>
  </div>

  <ng-container *ngIf="courses">
    <div class="table-wrapper mt-3">
    <table class="table-dress">
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Active</th>
        <th>Teacher</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let course of courses">
        <td>{{course.id}}</td>
        <td>{{course.name}}</td>
        <td>{{course.isActive}}</td>
        <td>{{course.teacherName}}</td>
        <td>
          <a class="btn button" [routerLink]="['/admin/course', course.id]">Edit</a>
        </td>
      </tr>
      </tbody>
    </table>
    </div>
  </ng-container>
</div>
