<div class="container">
  <h1 class="mt-3">List of courses</h1>
  <div class="d-flex justify-content-end mt-3">
    <a [routerLink]="['/admin/course/add']"  class="btn btn-primary">Add course</a>
  </div>

  <ng-container *ngIf="courses">
    <table class="mt-3 table table-bordered">
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Start</th>
        <th>End</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let course of courses">
        <td>{{course.id}}</td>
        <td>{{course.name}}</td>
        <td>{{course.startDate}}</td>
        <td>{{course.endDate}}</td>
      </tr>
      </tbody>
    </table>
  </ng-container>
</div>
