<div class="container">
  <h1 class="mt-3">Add course</h1>

  <form #form="ngForm" (ngSubmit)="onFromSubmit()" >
    <div class="mt-2">

      <div class="mt-3">
        <label class="form-label">Enter Name of course</label>
        <input type="text" id="courseName" class="form-control" name="courseName" [(ngModel)]="model.name"  >
      </div>

      <div class="mt-3">
        <label class="form-label">Enter start of course</label>
        <input type="date" id="courseStart" class="form-control" name="courseStart" [(ngModel)]="model.startDate"  >
      </div>

      <div class="mt-3">
        <label class="form-label">Enter end of course</label>
        <input type="date" id="courseEnd" class="form-control" name="courseEnd" [(ngModel)]="model.endDate" >
      </div>

      <div class="mt-3">
        <label class="form-label">Add teacher</label>
        <select id="teacherId" class="form-control" [(ngModel)]="model.teacherId" name="teacherId">
          <option *ngFor="let teacher of teachers" [value]="teacher.id">{{ teacher.userName}}</option>
        </select>
      </div>


      <div class="mt-3">
        <button type="submit" class="button btn">Save</button>
      </div>

    </div>

  </form>
</div>
