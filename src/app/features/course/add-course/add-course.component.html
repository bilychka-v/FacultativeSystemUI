<div class="container">
  <h1 class="mt-3">Add course</h1>

  <form #form="ngForm" (ngSubmit)="onFormSubmit()" >
    <div class="mt-2">

      <div class="mt-3">
        <label class="form-label">Enter Name of course</label>
        <input type="text" id="name" class="form-control" name="name" [(ngModel)]="model.name"  >
        <div class="error" *ngIf="serverErrors['name']">{{ serverErrors['name'] }}</div>
      </div>

      <div class="mt-3">
        <label class="form-label">Enter start of course</label>
        <input type="date" id="startDate" class="form-control" name="startDate" [(ngModel)]="model.startDate"  >
        <div class="error" *ngIf="serverErrors['startDate']">{{ serverErrors['startDate'] }}</div>
      </div>

      <div class="mt-3">
        <label class="form-label">Enter end of course</label>
        <input type="date" id="endDate" class="form-control" name="endDate" [(ngModel)]="model.endDate" >
        <div class="error" *ngIf="serverErrors['endDate']">{{ serverErrors['endDate'] }}</div>
      </div>

      <div class="mt-3">
        <label class="form-label">Add teacher</label>
        <select id="teacherId" class="form-control" [(ngModel)]="model.teacherId" name="teacherId">
          <option *ngFor="let teacher of teachers" [value]="teacher.id">{{ teacher.userName}}</option>
        </select>
        <div class="error" *ngIf="serverErrors['teacherId']">{{ serverErrors['teacherId'] }}</div>
      </div>


      <div class="mt-3">
        <button type="submit" class="button btn">Save</button>
      </div>

    </div>

  </form>
</div>
