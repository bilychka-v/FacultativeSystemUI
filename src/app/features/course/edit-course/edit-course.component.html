<div class="container">
  <h1>Edit</h1>
  <ng-container *ngIf="course; else notFound" >
    <form #form = "ngForm" (ngSubmit)="onFormSubmit()">
      <div class="mt-2">

        <div class="mt-3">
          <label for="courseId" class="form-label">Course id</label>
            <input type="text" id="courseId" class="form-control" name="courseId" disabled value="{{course.id}}">
        </div>

        <div class="mt-3">
          <label for="courseName" class="form-label">Name</label>
            <input type="text" id="courseName" class="form-control" name="courseName" [(ngModel)]="course.name">
        </div>

        <div class="mt-3">
          <label for="courseStart" class="form-label">Start of course</label>
            <input type="text" id="courseStart" class="form-control" name="courseStart" [(ngModel)]="course.startDate">
        </div>

        <div class="mt-3">
          <label for="courseEnd" class="form-label">End of course</label>
            <input type="text" id="courseEnd" class="form-control" name="courseEnd" [(ngModel)]="course.endDate">
        </div>

        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Save</button>
        </div>

      </div>
    </form>
  </ng-container>
  <ng-template #notFound>

    <div class="alert alert-warning" role="alert">
      Course not found
    </div>

  </ng-template>


</div>
