<div class="container">
  <h1 class="mt-3">List of teachers</h1>
  <div class="d-flex justify-content-end mt-3">
    <a [routerLink]="['/admin/teacher/add']"  class="btn btn-primary">Add teacher</a>
  </div>

  <ng-container *ngIf="teachers">
    <div class="table-wrapper">
    <table class="table-dress">
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Courses</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let teacher of teachers">
        <td>{{teacher.id}}</td>
        <td>{{teacher.userName}}</td>
        <td>{{ teacher.courses?.join(", ") || "—" }}</td>

        <td>
<!--          <a class="btn btn-light" [routerLink]="['/admin/course', course.id]">Edit</a>-->
        </td>
      </tr>
      </tbody>
    </table>
    </div>
  </ng-container>
</div>
