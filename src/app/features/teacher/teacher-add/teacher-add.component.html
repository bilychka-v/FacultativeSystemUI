<div class="container">

  <h1>Add teacher</h1>

  <form #form = "ngForm" (ngSubmit)="onSubmit()">

    <div class="mt-2">

      <div class="mt-3">
    <label  class="form-label" for="teacherName">Enter Teacher's name: </label>
    <input id="teacherName" type="text" class="form-control" name="userName" [(ngModel)]="model.userName" >
      </div>

      <div class="mt-3">
        <label  class="form-label" for="teacherEmail">Enter Teacher's email: </label>
        <input id="teacherEmail" type="email" class="form-control" name="email" [(ngModel)]="model.email" >
      </div>

      <div class="mt-3">
        <label  class="form-label" for="teacherPassword">Enter Teacher's password: </label>
        <input id="teacherPassword" type="password" class="form-control" name="password" [(ngModel)]="model.password" >
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>

    </div>

  </form>
</div>
