<div class="container mt-4">
  <h2>Grades and Feedback</h2>

  <h4 class="mb-4">
    Sort by:
    <span>
      <button class="btn btn-sm button ms-2" (click)="sortByGrades('Grade', 'desc')">Grades (From higher)</button>
       <button class="btn btn-sm button ms-2" (click)="sortByGrades('Grade', 'asc')">Grades (From higher)</button>
<!--      <button class="btn btn-sm button ms-2" (click)="sort('name', 'desc')">Name (Z-A)</button>-->
<!--      <button class="btn btn-sm button ms-2" (click)="sort('date', 'desc')">New</button>-->
<!--      <button class="btn btn-sm button ms-2" (click)="sort('date', 'asc')">Old</button>-->
    </span>
  </h4>

  <ng-container  *ngIf="studentGrades && studentGrades.length > 0; else noStudents">
    <div class="table-wrapper">
    <table class="table-dress table-hover">
      <thead>
      <tr>
        <th>Student</th>
        <th>Grade</th>
        <th>Feedback</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let student of studentGrades">
        <td>{{ student.studentName}}</td>
        <td>{{ student.grade }}</td>
        <td>{{ student.feedback }}</td>
        <td>
          <a class="btn button" [routerLink]="['/course', student.feedbackId, 'feedback']">Edit grade</a>
        </td>
      </tr>
      </tbody>
    </table>
    </div>
    <button (click)="goBack()" class="btn button mt-3">Go Back</button>
  </ng-container>

  <ng-template #noStudents>
    <p>No students enrolled or no grades available.</p>
  </ng-template>
</div>
