<div class="container">
  <h1>Edit</h1>
  <ng-container *ngIf="feedback; else notFound" >
    <form #form = "ngForm" (ngSubmit)="onFormSubmit()">
      <div class="mt-2">

        <div class="mt-3">
          <label for="grade" class="form-label">Grade</label>
          <input type="number" id="grade" class="form-control" name="grade" [(ngModel)]="feedback.grade">
        </div>

        <div class="mt-3">
          <label for="feedback" class="form-label">Feedback</label>
          <input type="text" id="feedback" class="form-control" name="feedback" [(ngModel)]="feedback.feedback">
        </div>

        <div class="mt-3 d-flex">
          <button type="submit" class="btn button">Save</button>
        </div>

      </div>
    </form>
  </ng-container>
  <ng-template #notFound>

    <div class="alert alert-warning" role="alert">
      Feedback not found
    </div>

  </ng-template>


</div>
